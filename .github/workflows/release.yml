name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing and build attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      # `subdomain-finder --version` reads package.json, so it must match the tag.
      - name: Check tag matches package.json version
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: Build release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          npm pack --pack-destination release
          mv release/sectui-subdomain-finder-"$version".tgz release/subdomain-finder-"$version".tgz
          npm run bundle
          cp dist/subdomain-finder.mjs release/subdomain-finder-"$version".mjs
          test "$(node release/subdomain-finder-"$version".mjs --version)" = "$version"
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest@v4
        with:
          subject-path: release/*

      # Trusted publishing (OIDC, no token). The first version is published by hand, hence the check.
      - name: Publish to npm
        run: |
          if npm view "$(jq -r .name package.json)@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "Already on npm, skipping"
          else
            npm publish --access public
          fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes release/*
        env:
          GH_TOKEN: ${{ github.token }}

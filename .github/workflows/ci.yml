name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported version (see "engines" in package.json) and latest.
        node-version: ["26", latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npm run bundle
      - name: Smoke test the built CLI and the bundle
        run: |
          node dist/cli.js --list-sources | grep -q '^crtname '
          test "$(node dist/subdomain-finder.mjs --version)" = "$(jq -r .version package.json)"
